name: Deploy Admin

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude=.next \
            --exclude='**/.next' \
            --exclude=dist \
            --exclude='**/dist' \
            --exclude=.turbo \
            --exclude='**/.turbo' \
            --exclude=.vercel \
            --exclude='**/.vercel' \
            -czf /tmp/repo.tar.gz .

      - name: Upload deployment to Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          ADMIN_SITE_ID: ${{ vars.ADMIN_SITE_ID }}
        run: |
          curl --fail-with-body \
            -X POST "${APPWRITE_ENDPOINT%/}/sites/${ADMIN_SITE_ID}/deployments" \
            -H "X-Appwrite-Project: ${APPWRITE_PROJECT_ID}" \
            -H "X-Appwrite-Key: ${APPWRITE_API_KEY}" \
            -F "code=@/tmp/repo.tar.gz;type=application/gzip" \
            -F "activate=true"