name: Deploy Admin

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check if admin is affected
        id: check_affected
        run: |
          if bunx turbo query affected --packages admin --exit-code; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes found. Skipping deployment."
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected. Proceeding with deployment."
            else
              echo "turbo query failed with exit code $status"
              exit "$status"
            fi
          fi

      - name: Create source archive
        if: steps.check_affected.outputs.deploy == 'true'
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude=.next \
            --exclude='**/.next' \
            --exclude=dist \
            --exclude='**/dist' \
            --exclude=.turbo \
            --exclude='**/.turbo' \
            --exclude=.vercel \
            --exclude='**/.vercel' \
            -czf /tmp/repo.tar.gz .

      - name: Upload deployment to Appwrite
        if: steps.check_affected.outputs.deploy == 'true'
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          ADMIN_SITE_ID: ${{ vars.ADMIN_SITE_ID }}
        run: |
          curl --fail-with-body \
            -X POST "${APPWRITE_ENDPOINT%/}/sites/${ADMIN_SITE_ID}/deployments" \
            -H "X-Appwrite-Project: ${APPWRITE_PROJECT_ID}" \
            -H "X-Appwrite-Key: ${APPWRITE_API_KEY}" \
            -F "code=@/tmp/repo.tar.gz;type=application/gzip" \
            -F "activate=true"