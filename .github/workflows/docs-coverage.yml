name: Docs coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: List changed files
        run: git -c core.quotepath=false diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
      - name: Check docs coverage
        run: bun apps/docs/scripts/page-coverage/cli.ts --changed "$RUNNER_TEMP/changed.txt"
