<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BISO · Webshop Editor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #faf7f2;
    --paper-2: #f3eee5;
    --paper-3: #ede6d8;
    --ink: #1a1814;
    --ink-2: #3a342a;
    --ink-3: #6b6357;
    --ink-4: #9c9385;
    --rule: #e5dcca;
    --rule-2: #d8cdb6;
    --claret: #6b1e1e;
    --claret-2: #8a2727;
    --gold: #b08a3e;
    --leaf: #2f5d3a;
    --sky: #2a4a7a;

    --ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(107,30,30,0.018), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(176,138,62,0.020), transparent 45%);
    mix-blend-mode: multiply;
  }
  #root{position:relative; z-index:2; height:100%}

  ::selection{background: rgba(107,30,30,0.18); color: var(--ink);}

  button{font: inherit; color: inherit;}
  input,textarea,select{font: inherit; color: inherit;}
  textarea{resize:none}

  .mono{font-family: var(--mono); font-feature-settings: "tnum" 1, "ss01" 1;}
  .serif{font-family: var(--serif); font-weight: 400; letter-spacing: -0.005em;}
  .hairline{border: 0; border-top: 0.5px solid var(--rule);}

  .scroll{scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.15) transparent;}
  .scroll::-webkit-scrollbar{width:8px; height:8px}
  .scroll::-webkit-scrollbar-thumb{background: rgba(0,0,0,0.15); border-radius: 4px; border: 2px solid transparent; background-clip: content-box}
  .scroll::-webkit-scrollbar-thumb:hover{background: rgba(0,0,0,0.28); background-clip: content-box; border: 2px solid transparent}

  /* shared status pill base — extended per route */
  .status{
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--paper-2); color: var(--ink-2);
    border: 0.5px solid var(--rule-2);
    text-transform: capitalize;
  }
  .status .pulse{width:6px; height:6px; border-radius:50%; background: var(--ink-4);}

  /* shared keyboard tag */
  .kbd{
    font-family: var(--mono); font-size: 10.5px;
    padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.05); color: var(--ink-3);
    border: 0.5px solid var(--rule-2);
  }

  @keyframes fadeUp { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  @keyframes drift {
    0%{transform: translate(0,0) rotate(0)}
    50%{transform: translate(8px,-6px) rotate(.4deg)}
    100%{transform: translate(0,0) rotate(0)}
  }
  @keyframes caret { 50%{opacity:0} }
  @keyframes shimmer{ from{background-position: -200% 0} to{background-position: 200% 0} }
  @keyframes ringIn { from{transform: scale(.7); opacity:0} to{transform: scale(1); opacity:1} }
  @keyframes confetti { to{ transform: translate(var(--tx), var(--ty)) rotate(var(--tr)); opacity:0 } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<script type="text/babel" src="src/icons.jsx"></script>

<script type="text/babel" src="src/shop-preview.jsx"></script>
<script type="text/babel" src="src/shop-composer.jsx"></script>

<script type="text/babel" src="src/shop-publish.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/shop-app.jsx"></script>

</body>
</html>
